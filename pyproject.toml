[project]
name = "text-summarisation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tisha7353", email = "tgtishagarg@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "pytube>=15.0.0",
    "requests>=2.34.2",
    "streamlit>=1.65.0",
    "validators>=0.35.0",
    "youtube-transcript-api>=1.2.4",
]

[project.scripts]
text-summarisation = "text_summarisation:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
